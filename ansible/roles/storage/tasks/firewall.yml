- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow SSH
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: true

- name: Restrict SeaweedFS ports to cluster CIDR
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    source: "{{ seaweedfs_allowed_cidr }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ seaweedfs_s3_port }}"
    - "{{ seaweedfs_master_port }}"
    - "{{ seaweedfs_filer_port }}"

- name: Drop SeaweedFS ports from other sources
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: disabled
    immediate: true
  loop:
    - "{{ seaweedfs_s3_port }}"
    - "{{ seaweedfs_master_port }}"
    - "{{ seaweedfs_filer_port }}"
