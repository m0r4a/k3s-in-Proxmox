- name: Load kernel modules required by Docker
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
    - iptable_nat

- name: Persist kernel modules for Docker
  ansible.builtin.copy:
    dest: /etc/modules-load.d/docker.conf
    content: |
      overlay
      br_netfilter
      iptable_nat
    owner: root
    group: root
    mode: "0644"

- name: Install the docker-ce dnf repository
  ansible.builtin.command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo
  changed_when: true

- name: Install Docker CE and compose plugin
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
